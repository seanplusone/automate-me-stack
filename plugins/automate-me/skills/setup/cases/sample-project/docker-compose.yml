# Local stack for the demo-shop sample project.
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: shop
      POSTGRES_PASSWORD: compose-fake-secret-123
    ports:
      - "5433:5432"
  web:
    build: .
    depends_on: [db]
    ports:
      - "8080:3000"
  cache:
    image: redis:7
    ports:
      - "6380:6379"
