[models.acme-large]
vendor = "acme"
family = "acme"

[models.acme-mid]
vendor = "acme"
family = "acme"

[models.acme-mini]
vendor = "acme"
family = "acme"
light = true

[roles.helper]
default = "acme-mini"
effort = "low"
edits = true

[roles.build]
default = "acme-large"
effort = "high"
options = ["acme-mid"]
escalate = "Use build-hard after a repeated failure."

[roles.build-hard]
default = "acme-large"
effort = "xhigh"

[roles.review]
default = "acme-large"
effort = "high"
options = ["acme-mid"]
