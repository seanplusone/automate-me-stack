<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Wait</title>
</head>
<body style="margin:0;font:16px/24px Arial,sans-serif">

<style>
.spin { width:32px; height:32px; border-radius:50%; border:3px solid #ddd; border-top-color:#333; animation:turn 1s linear infinite; }
@keyframes turn { to { transform: rotate(360deg); } }
</style>
<main style="padding:24px">
  <div class="spin"></div>
  <p>Loading your account details, one moment please.</p>
</main>

</body>
</html>
