<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><title>Sign in</title></head>
<body style="margin:0;font:16px/24px Arial,sans-serif">
<main style="width:480px;max-width:100%;margin:32px auto">
  <form style="padding:16px;border:1px solid #ccc">

    <select><option>Workspace</option></select>

  </form>
</main></body></html>
