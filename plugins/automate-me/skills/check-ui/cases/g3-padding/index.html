<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Panels</title>
<link rel="stylesheet" href="../base.css">
</head>
<body>
<main>
  <h1>Panels</h1>
  <p>Four panels of the same kind.</p>
  <div class="stack">
    <section class="group" data-ui="group">
      <article class="card" data-ui="card">
        <h2>Profile</h2>
        <p>Name and photo.</p>
      </article>
      <article class="card" data-ui="card" id="loose" style="padding: 36px">
        <h2>Password</h2>
        <p>Change the sign-in password.</p>
      </article>
    </section>
    <section class="group" data-ui="group">
      <article class="card" data-ui="card">
        <h2>Language</h2>
        <p>English on this device.</p>
      </article>
      <article class="card" data-ui="card">
        <h2>Time zone</h2>
        <p>Local time for due dates.</p>
      </article>
    </section>
  </div>
  <button type="button">Save panels</button>
</main>
</body>
</html>
