<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Frame</title>
</head>
<body style="margin:0;font:16px/24px Arial,sans-serif">
<main style="padding:16px">
  <h1 style="margin:0 0 12px">Samples</h1>
  <p style="margin:0 0 12px">The pattern is the frame. The sample sits on top of it.</p>
  <div style="position:relative;height:220px;border:1px solid #ccc;background-image:repeating-linear-gradient(45deg,#e8e8e8,#e8e8e8 6px,#f4f4f4 6px,#f4f4f4 12px)">
    <div style="position:absolute;left:16px;top:16px;right:16px;height:180px">
      <h2 style="margin:0">Sample</h2>
      <p style="margin:0">The sample floats on the pattern.</p>
    </div>
  </div>
</main>
</body>
</html>
