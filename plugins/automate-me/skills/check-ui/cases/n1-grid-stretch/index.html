<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Plans</title>
</head>
<body style="font:16px/24px Arial,sans-serif">

<main>
  <h1>Plans</h1>
  <p>Pick a size for the shop.</p>
  <div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px">
    <article class="card" style="padding:16px;border:1px solid #ccc;background:#f6f6f6"><h2>Free</h2><p>One list.</p></article>
    <article class="card" style="padding:16px;border:1px solid #ccc;background:#f6f6f6"><h2>Plus</h2><p>Shared lists for a family, with notes and a long history.</p></article>
    <article class="card" style="padding:16px;border:1px solid #ccc;background:#f6f6f6"><h2>Team</h2><p>An office.</p></article>
  </div>
  <button type="button">Choose</button>
</main>

</body>
</html>
