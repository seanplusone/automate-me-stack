<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Settings</title>
<link rel="stylesheet" href="../base.css">
</head>
<body>
<main>
  <h1>Settings</h1>
  <p>Choose how this device behaves.</p>
  <div class="stack">
    <section class="group" data-ui="group">
      <article class="card" data-ui="card">
        <h2>Notifications</h2>
        <p>Email when a task is due.</p>
      </article>
      <article class="card" data-ui="card">
        <h2>Sounds</h2>
        <p>Play a sound when a task finishes.</p>
      </article>
    </section>
    <section class="group" data-ui="group">
      <article class="card" data-ui="card">
        <h2>Theme</h2>
        <p>Light background and dark text.</p>
      </article>
      <article class="card" data-ui="card">
        <h2>Density</h2>
        <p>Compact rows in lists.</p>
      </article>
    </section>
  </div>
  <button type="button">Save settings</button>
</main>
</body>
</html>
