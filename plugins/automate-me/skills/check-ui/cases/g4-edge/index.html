<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Tasks</title>
<link rel="stylesheet" href="../base.css">
</head>
<body>
<main>
  <h1>Tasks</h1>
  <p>Two things left today.</p>
  <div class="stack">
    <section class="group" data-ui="group">
      <article class="card" data-ui="card">
        <h2>Buy milk</h2>
        <p>One bottle.</p>
      </article>
      <article class="card" data-ui="card">
        <h2>Walk the dog</h2>
        <p>Around the block.</p>
      </article>
    </section>
    <section class="group" data-ui="group">
      <article class="card" data-ui="card">
        <h2>Read mail</h2>
        <p>Inbox only.</p>
      </article>
      <article class="card" data-ui="card">
        <h2>Water plants</h2>
        <p>The fern by the window.</p>
      </article>
    </section>
  </div>
  <button type="button" id="shifted" style="margin-left: 28px">Add a task</button>
</main>
</body>
</html>
