<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Settings</title>
</head>
<body style="font:16px/24px Arial,sans-serif">

<main>
  <h1>Settings</h1>
  <p>Choose how this device behaves.</p>
  <div style="display:flex;flex-direction:column;gap:24px">
    <div class="field-group" style="display:flex;flex-direction:column;gap:8px">
      <article class="card" style="padding:16px;border:1px solid #ccc;background:#f6f6f6"><h2>Notifications</h2><p>Email when a task is due.</p></article>
      <article class="card" style="padding:16px;border:1px solid #ccc;background:#f6f6f6"><h2>Sounds</h2><p>Play a sound when a task finishes.</p></article>
    </div>
    <div class="field-group" style="display:flex;flex-direction:column;gap:8px">
      <article class="card" style="padding:16px;border:1px solid #ccc;background:#f6f6f6"><h2>Theme</h2><p>Light background and dark text.</p></article>
      <article class="card" style="padding:16px;border:1px solid #ccc;background:#f6f6f6"><h2>Density</h2><p>Compact rows in lists.</p></article>
    </div>
  </div>
  <button type="button">Save settings</button>
</main>

</body>
</html>
