<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Dashboard</title>
</head>
<body style="font:16px/24px Arial,sans-serif">

<main style="width:50%;margin:0 auto;box-sizing:border-box">
  <h1>Dashboard</h1>
  <p>Today at a glance.</p>
  <div style="display:grid;grid-template-columns:1fr 1fr;gap:12px">
    <div style="padding:16px;border:1px solid #ccc;background:#f6f6f6"><h2>Open</h2><p>12 items</p></div>
    <div style="padding:16px;border:1px solid #ccc;background:#f6f6f6"><h2>Done</h2><p>4 items</p></div>
    <div style="padding:16px;border:1px solid #ccc;background:#f6f6f6"><h2>Later</h2><p>3 items</p></div>
    <div style="padding:16px;border:1px solid #ccc;background:#f6f6f6"><h2>Held</h2><p>1 item</p></div>
  </div>
  <button type="button">Refresh</button>
</main>

</body>
</html>
