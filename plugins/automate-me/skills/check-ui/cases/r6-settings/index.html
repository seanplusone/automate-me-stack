<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Settings</title>
</head>
<body style="margin:0;font:16px/24px Arial,sans-serif">

<main style="width:420px;max-width:100%;margin:32px auto">
  <form style="padding:16px;border:1px solid #ccc">
    <h1 style="margin:0 0 8px">Settings</h1>
    <p style="margin:0 0 8px">Update the account details for this workspace.</p>
    <input name="name">
    <input name="email">
    <input name="phone">
    <input name="city">
    <input type="password" name="password">
    <button type="button">Save</button>
  </form>
</main>

</body>
</html>
