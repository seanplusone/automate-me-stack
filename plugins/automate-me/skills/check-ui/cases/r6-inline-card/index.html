<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Inline</title>
</head>
<body style="margin:0;font:16px/24px Arial,sans-serif">

<main style="padding:16px">
  <h1>Notes</h1>
  <p>One of these boxes is much taller than the words inside it.</p>
  <span style="display:inline-block;width:280px;height:260px;padding:16px;border:1px solid #ccc;background:#fff;box-sizing:border-box">
    <h2 style="margin:0">Title</h2>
    <p style="margin:0">Short.</p>
  </span>
</main>

</body>
</html>
