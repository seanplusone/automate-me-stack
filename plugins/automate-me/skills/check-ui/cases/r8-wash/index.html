<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Wash</title>
</head>
<body style="margin:0;font:16px/24px Arial,sans-serif">
<main style="padding:16px">
  <h1 style="margin:0 0 12px">Picture</h1>
  <p style="margin:0 0 12px">The caption sits on a wash over the picture.</p>
  <div style="position:relative;width:320px;height:240px">
    <img alt="A wide hill under a pale sky" src="data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='320' height='240'><rect width='320' height='240' fill='%238ab'/></svg>" style="width:320px;height:240px;display:block">
    <div style="position:absolute;left:0;top:0;width:320px;height:240px;background-image:linear-gradient(transparent,#123)">
      <p style="position:absolute;left:12px;bottom:12px;margin:0;color:#fff">A quiet hill</p>
    </div>
  </div>
</main>
</body>
</html>
