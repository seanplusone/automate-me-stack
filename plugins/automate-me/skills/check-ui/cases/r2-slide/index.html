<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Slide</title>
<style>@keyframes slide { from { transform: translateX(-80px) } to { transform: none } }</style>
</head>
<body style="font:16px/24px Arial,sans-serif">

<main>
  <h1>Slide</h1>
  <p>The card moves in, then rests.</p>
  <article class="card" style="padding:16px;border:1px solid #ccc;background:#f6f6f6;animation:slide .4s forwards">
    <h2 style="margin:0">Hello</h2>
    <p style="margin:0">It has arrived.</p>
  </article>
  <button type="button">Save</button>
</main>

</body>
</html>
