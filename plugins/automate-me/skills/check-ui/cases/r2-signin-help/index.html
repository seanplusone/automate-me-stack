<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Sign in</title>

</head>
<body style="font:16px/24px Arial,sans-serif">

<main style="width:420px;max-width:100%;margin:32px auto">
  <form style="padding:16px;border:1px solid #ccc">
    <h1 style="margin:0 0 8px">Sign in</h1>
    <p style="margin:0 0 8px">Use the email you signed up with.</p>
    <input type="password" name="password">
    <button type="button">Sign in</button>
  </form>
  <aside style="padding:16px;border:1px solid #ccc;background:#f6f6f6;margin-top:16px"><p>Need an account? Ask the owner.</p></aside>
</main>

</body>
</html>
