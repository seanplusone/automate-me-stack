<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Board</title>

</head>
<body style="font:16px/24px Arial,sans-serif">

<main style="width:420px;margin:24px auto;padding:16px;border:1px solid #ccc;box-sizing:border-box">
  <h1>Board</h1>
  <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px">
    <div style="padding:16px;border:1px solid #ccc;background:#f6f6f6"><p>Open</p></div>
    <div style="padding:16px;border:1px solid #ccc;background:#f6f6f6"><p>Done</p></div>
  </div>
  <button type="button">Refresh</button>
</main>

</body>
</html>
