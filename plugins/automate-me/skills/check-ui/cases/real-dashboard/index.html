<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Dashboard</title>
</head>
<body style="font:16px/24px Arial,sans-serif">

<main>
  <h1>Dashboard</h1>
  <p>Today at a glance.</p>
  <div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:16px">
    <div style="padding:16px;border:1px solid #ccc;background:#f6f6f6"><h2>Open</h2><p>12</p></div>
    <div style="padding:16px;border:1px solid #ccc;background:#f6f6f6"><h2>Waiting</h2><p>A longer note about items that are still open today.</p></div>
    <div style="padding:16px;border:1px solid #ccc;background:#f6f6f6"><h2>Done</h2><p>4</p></div>
  </div>
  <button type="button">Refresh</button>
</main>

</body>
</html>
